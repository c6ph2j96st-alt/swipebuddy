[project]
name = "swipebuddy"
version = "0.1.0"
description = "Local, privacy-first swipe assistant for tinder.com using a local VLM"
license = { text = "MIT" }
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs real browser/Ollama/GPU (skipped by default)"]
addopts = "-m 'not integration'"
