name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Scan for personal data
        run: python tools/scan_personal_data.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build with PyInstaller
        run: python -m PyInstaller build.spec --noconfirm --clean
      - name: Selftest built executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/SwipeBuddy/SwipeBuddy.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package zip and checksum
        shell: pwsh
        run: |
          $zip = "SwipeBuddy-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path dist/SwipeBuddy -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwipeBuddy-${{ github.ref_name }}-win64.zip
            SwipeBuddy-${{ github.ref_name }}-win64.zip.sha256
